# Nginx config for Bella Cucina RMS, exposed via DuckDNS (bellacucina.duckdns.org).
#
# Unlike Landing (separate frontend/admin/API containers), this app is a single
# Node/Express process (backend/src/server.js) that serves both the built
# frontend and the /api/* routes from the same origin — so one hostname is
# enough, no admin./api. subdomains needed.
#
# Install:
#   ln -s /root/Restaurant/deploy/nginx/bellacucina.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Then run certbot (see deploy notes) — it rewrites this to add TLS.

server {
    listen 80;
    listen [::]:80;
    server_name bellacucina.duckdns.org;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
