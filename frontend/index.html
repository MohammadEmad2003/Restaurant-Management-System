<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('lang');
          if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bella Cucina — Restaurant Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div id="loading" style="height: 100vh; display: grid; place-items: center; background: #f6f7fb; color: #111827; font-family: system-ui, sans-serif;">
        <div style="text-align: center;">
          <div style="width: 48px; height: 48px; border: 4px solid #eceef3; border-top-color: #7c3aed; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <div style="font-weight: 600;">Loading Bella Cucina…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx" id="main-script"></script>
    <script>
      (function() {
        var loading = document.getElementById('loading');
        function show(msg) {
          if (loading) loading.innerHTML = '<div style="max-width:520px;padding:24px;line-height:1.6;text-align:left;">' + msg + '</div>';
        }
        function showError(title, body) {
          show('<h2 style="color:#ef4444;margin:0 0 12px;">' + title + '</h2>' +
            '<p><strong>Paste everything below so the developer can fix it:</strong></p>' +
            '<pre style="background:#fff;border:1px solid #eceef3;padding:16px;border-radius:12px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-word;min-height:80px;">' + body + '</pre>' +
            '<p>Common fixes: backend on <code>http://localhost:4000</code>, disable JS-blocking extensions, hard refresh <kbd>Ctrl+F5</kbd></p>');
        }
        window.addEventListener('error', function(e) {
          showError('JavaScript error', (e.filename || '') + ':' + (e.lineno || '?') + '\n' + (e.message || String(e.error)));
        });
        window.addEventListener('unhandledrejection', function(e) {
          showError('Unhandled Promise Rejection', e.reason?.stack || e.reason);
        });
        var main = document.getElementById('main-script');
        if (main) {
          main.addEventListener('error', function() {
            showError('Failed to load main script', '/src/main.jsx could not be loaded.\nCheck F12 → Network tab and confirm the frontend dev server is running on port 5173.');
          });
        }
        var start = Date.now();
        function check() {
          var root = document.getElementById('root');
          if (root && root.children.length > 1) return; // React mounted
          if ((Date.now() - start) > 8000) {
            showError('React did not mount', 'No JavaScript errors were reported after 8 seconds.\n' +
              'This usually means the module script is not loading or executing.\n' +
              'Check these and paste the result:\n' +
              '1. Open http://localhost:5173/src/main.jsx in a new tab — JS or error?\n' +
              '2. F12 → Network → reload — is /src/main.jsx listed as loaded?\n' +
              '3. Are you using an old browser or extensions blocking scripts?');
          }
        }
        setTimeout(check, 8000);
      })();
    </script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
